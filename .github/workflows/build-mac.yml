
  name: build scrcpy 1.25 mac
  on: workflow_dispatch
  jobs:
    build:
      runs-on: macos-14   # Intel；要 ARM 改 macos-14
      steps:
        - uses: actions/checkout@v4
          with:
            repository: Genymobile/scrcpy
            ref: v1.25

        - name: install deps
          run: brew install meson ninja sdl2 ffmpeg@4 libusb pkg-config

        - name: fetch prebuilt server jar
          run: |
            curl -fL -o scrcpy-server-v1.25 \
              https://github.com/Genymobile/scrcpy/releases/download/v1.25/scrcpy-server-v1.25

        - name: configure
          run: |
            meson setup x --buildtype=release --strip -Db_lto=true \
              -Dprebuilt_server=$PWD/scrcpy-server-v1.25

        - name: build
          run: ninja -Cx

        - uses: actions/upload-artifact@v4
          with:
            name: scrcpy-1.25-mac
            path: |
              x/app/scrcpy
              scrcpy-server-v1.25
