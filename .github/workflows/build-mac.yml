name: build scrcpy 1.16 mac (x86_64 via Rosetta)
on: workflow_dispatch

env:
  SCRCPY_REF: v1.16
  SCRCPY_VER: "1.16"

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner (queue is fast); we cross-compile to x86_64
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Genymobile/scrcpy
          ref: ${{ env.SCRCPY_REF }}

      - name: install x86_64 Homebrew (to /usr/local)
        run: |
          arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          /usr/local/bin/brew --version
          file /usr/local/bin/brew || true

      - name: install x86_64 deps via Rosetta brew
        run: |
          # Homebrew sometimes exits non-zero after a successful install on GitHub
          # Actions (caveats / post-install diagnostics). We tolerate that and
          # verify success via `brew list <pkg>` afterwards.
          set +e
          for pkg in meson ninja pkgconf sdl2 ffmpeg@4 libusb; do
            echo "::group::brew install $pkg"
            arch -x86_64 /usr/local/bin/brew install "$pkg"
            echo "::endgroup::"
          done
          set -e
          echo "==> verifying all formulas are installed"
          for pkg in meson ninja pkgconf sdl2 ffmpeg@4 libusb; do
            arch -x86_64 /usr/local/bin/brew list --formula "$pkg" >/dev/null \
              || { echo "MISSING: $pkg"; exit 1; }
            echo "  ok: $pkg"
          done
          # ffmpeg@4 is keg-only; force-link so /usr/local/opt/ffmpeg@4 resolves
          # and pkg-config picks it up via the explicit PATH below.
          arch -x86_64 /usr/local/bin/brew link --force --overwrite ffmpeg@4 || true
          echo "==> verifying dylibs are x86_64"
          file /usr/local/opt/sdl2/lib/libSDL2.dylib
          file /usr/local/opt/ffmpeg@4/lib/libavformat.dylib
          file /usr/local/opt/libusb/lib/libusb-1.0.dylib

      - name: fetch prebuilt server jar
        run: |
          curl -fL -o "scrcpy-server-v${SCRCPY_VER}" \
            "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VER}/scrcpy-server-v${SCRCPY_VER}"

      - name: configure (cross-compile to x86_64)
        env:
          PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          PKG_CONFIG: /usr/local/bin/pkgconf
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/opt/ffmpeg@4/lib/pkgconfig:/usr/local/opt/sdl2/lib/pkgconfig:/usr/local/opt/libusb/lib/pkgconfig
        run: |
          arch -x86_64 /usr/local/bin/meson setup x \
            --buildtype=release --strip -Db_lto=true \
            -Dc_args=-D_DARWIN_C_SOURCE \
            -Dprebuilt_server="$PWD/scrcpy-server-v${SCRCPY_VER}"

      - name: build
        env:
          PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
        run: arch -x86_64 /usr/local/bin/ninja -Cx

      - name: verify x86_64
        run: |
          file x/app/scrcpy
          file x/app/scrcpy | grep -q x86_64 || (echo "NOT x86_64!" && exit 1)

      - name: install dylibbundler (x86_64)
        run: |
          arch -x86_64 /usr/local/bin/brew install dylibbundler

      - name: package + bundle dylibs
        run: |
          mkdir -p out/lib
          cp x/app/scrcpy "out/scrcpy-${SCRCPY_VER}"
          cp "scrcpy-server-v${SCRCPY_VER}" out/
          chmod +x "out/scrcpy-${SCRCPY_VER}"

          # Copy all non-system dylibs into out/lib and rewrite the binary's
          # load paths to @executable_path/lib so it runs anywhere.
          arch -x86_64 /usr/local/bin/dylibbundler \
            --overwrite-files \
            --bundle-deps \
            --fix-file "out/scrcpy-${SCRCPY_VER}" \
            --dest-dir out/lib/ \
            --install-path '@executable_path/lib/' \
            --search-path /usr/local/opt/ffmpeg@4/lib \
            --search-path /usr/local/opt/sdl2/lib \
            --search-path /usr/local/opt/libusb/lib \
            --search-path /usr/local/lib

          echo "==> bundled libs"
          ls -la out/lib
          echo "==> final load commands"
          otool -L "out/scrcpy-${SCRCPY_VER}"

      - name: smoke test (no display, just --version)
        run: |
          cd out
          arch -x86_64 "./scrcpy-${SCRCPY_VER}" --version || true
          # --version prints to stderr and exits 0 on scrcpy 1.x; we only
          # care that dyld doesn't fail.
          arch -x86_64 "./scrcpy-${SCRCPY_VER}" --version 2>&1 | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-${{ env.SCRCPY_VER }}-macos-x86_64
          path: out/
